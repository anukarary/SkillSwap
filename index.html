<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillSwap</title>
<style>
:root{--ink:#1c1917;--mute:#6b6258;--paper:#f6f1e8;--panel:#fffdf8;--line:#e4d9c8;--accent:#0f6e56;--accent-ink:#f4fff9;--credit:#9a5b12;--danger:#9f2d22;--ok:#0f6b45;--shadow:0 10px 30px rgba(70,48,20,.06)}
@media (prefers-color-scheme:dark){:root{--ink:#f3eee6;--mute:#b3a89c;--paper:#141210;--panel:#211c17;--line:#3a322a;--accent:#3dbea0;--accent-ink:#06211c;--credit:#e2b15a;--danger:#f0a097;--ok:#8ed7ae;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
aside{background:#10241e;color:#f4f7f4;border-right:0;padding:28px 18px;display:flex;flex-direction:column;gap:8px}
aside .meta{color:#c9d5cf}
aside .btn{background:transparent;color:#f4f7f4;border-color:#35574c}
aside .credit{background:#18332b;border-color:#2c4a40}
.brand{font-family:Georgia,"Palatino Linotype",serif;font-size:28px;font-weight:700;letter-spacing:-.03em;margin:0 0 4px}
.who{margin:0 0 8px}
.credit{margin:4px 0 16px;padding:14px 14px 12px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(15,110,86,.08),transparent)}
.credit b{display:block;font-size:40px;line-height:1;color:var(--credit);font-variant-numeric:tabular-nums;font-family:Georgia,"Palatino Linotype",serif}
.credit small{color:var(--mute)}
nav{display:grid;gap:4px}
nav button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer}
nav button[aria-current=true]{background:var(--accent);color:var(--accent-ink)}
nav button:hover:not([aria-current=true]){background:#1a332b}
main{padding:32px 36px 48px;max-width:920px;width:100%}
h2{margin:0 0 16px;font-family:Georgia,"Palatino Linotype",serif;font-size:30px;font-weight:600;letter-spacing:-.03em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);flex:1 1 140px}
input,select,textarea{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--mute);background:var(--paper)}
.tag.completed,.tag.confirmed{color:var(--ok);border-color:var(--ok);background:transparent}
.tag.cancelled,.tag.no_show_reported{color:var(--danger);border-color:var(--danger);background:transparent}
.meta{color:var(--mute);font-size:13px}
.head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chat{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.chat p{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;display:none;max-width:min(520px,90vw)}
#toast.err{background:var(--danger);color:#fff}
.gate{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr}
.gate-story{background:#10241e;color:#f6f3ec;padding:72px 64px;display:flex;flex-direction:column;justify-content:flex-end;gap:18px}
.gate-story h1{margin:0;max-width:11ch;font-family:Georgia,"Palatino Linotype",serif;font-size:64px;font-weight:600;line-height:.98;letter-spacing:-.045em}
.gate-story p{margin:0;max-width:36ch;font-size:18px;color:#d5e4dc}
.gate-points{display:flex;gap:18px;margin:8px 0 0;padding:0;list-style:none;color:#b7cfc4}
.gate-panel{display:flex;flex-direction:column;justify-content:center;padding:56px 64px;background:#fffdf8}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 22px}
.kind button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gate-panel h2{margin-bottom:6px}
.stack{display:grid;gap:12px}
.stack[hidden],.linkish[hidden]{display:none}
.stack .btn.pri{width:100%;border-radius:12px;padding:12px}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:left}
@media (max-width:860px){.gate{grid-template-columns:1fr}.gate-story{padding:36px 24px;min-height:280px}.gate-story h1{font-size:42px}.gate-panel{padding:28px 20px}}
@media (max-width:720px){.app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;align-items:center;padding:16px}.credit{margin:0;min-width:120px}nav{display:flex;flex-wrap:wrap}nav button:hover:not([aria-current=true]){background:#1a332b}main{padding:16px}h2{font-size:26px}}
</style>
</head>
<body>
<div id="root"></div><div id="toast" role="status"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STATUS = { proposed: 'Санал', confirmed: 'Зөвшөөрсөн', completed: 'Дууссан', unconfirmed: 'Баталгаажаагүй', cancelled: 'Цуцлагдсан', no_show_reported: 'No-show' };
const fmt = (iso) => new Date(iso).toLocaleString('mn-MN', { dateStyle: 'medium', timeStyle: 'short' });
const local = (ms) => new Date(ms - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
let token = sessionStorage.getItem('tok'), me = null, tab = 'search', cache = {};

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...(token && { Authorization: `Bearer ${token}` }) }, body: body && JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.message || 'Та дахин оролдоно уу.');
  return data;
}
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = bad ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 3500);
}
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };

// ---------- Нэвтрэлт ----------
function loginView() {
  $('#root').innerHTML = `<div class="gate"><section class="gate-story"><p class="brand">SkillSwap</p>
  <h1>Ур чадвараа цагаар солилц.</h1>
  <p>Оюутан, хэрэглэгч өөрийн бүртгэлээр нэвтэрнэ. Заагч хайж, цаг захиалж, credit шилжүүлнэ.</p>
  <ul class="gate-points"><li>Хайлт</li><li>Цаг</li><li>Credit</li></ul></section>
  <section class="gate-panel"><div class="kind" role="group" aria-label="Бүртгэлийн төрөл">
    <button class="btn" type="button" data-kind="student" aria-pressed="true">Оюутан</button>
    <button class="btn" type="button" data-kind="user" aria-pressed="false">Хэрэглэгч</button></div>
  <h2 id="auth-title">Нэвтрэх</h2><p class="meta" id="kind-lead">Оюутны бүртгэлээр нэвтрэх.</p>
  <form id="lf" class="stack"><label>Имэйл<input name="email" type="email" autocomplete="username" required></label>
  <label>Нууц үг<input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn pri">Нэвтрэх</button></form>
  <p><button class="linkish" type="button" id="to-reg">Бүртгэлгүй юу? Бүртгүүлэх</button></p>
  <form id="rf" class="stack" hidden><label>Нэр<input name="name" required></label><label>Утас<input name="phone" required></label>
  <label>Имэйл<input name="email" type="email" required></label><label>Нууц үг<input name="password" type="password" minlength="8" required></label>
  <label>Заах ур чадвар<input name="skill" placeholder="Байхгүй бол хоосон"></label><label>Ангилал<input name="category" placeholder="Хэл, дизайн"></label>
  <button class="btn pri">Бүртгүүлэх</button></form>
  <p><button class="linkish" type="button" id="to-log" hidden>Бүртгэлтэй юу? Нэвтрэх</button></p></section></div>`;
  const enter = guard(async (email, password) => {
    token = (await api('POST', '/auth/login', { email, password })).access_token;
    sessionStorage.setItem('tok', token); await boot();
  });
  const kinds = [...document.querySelectorAll('[data-kind]')];
  kinds.forEach((button) => button.onclick = () => {
    kinds.forEach((item) => item.setAttribute('aria-pressed', item === button));
    $('#kind-lead').textContent = button.dataset.kind === 'student' ? 'Оюутны бүртгэлээр нэвтрэх.' : 'Хэрэглэгчийн бүртгэлээр нэвтрэх.';
  });
  $('#lf').onsubmit = (e) => { e.preventDefault(); const f = new FormData(e.target); enter(f.get('email'), f.get('password')); };
  $('#to-reg').onclick = () => { $('#lf').hidden = true; $('#to-reg').hidden = true; $('#rf').hidden = false; $('#to-log').hidden = false; $('#auth-title').textContent = 'Бүртгүүлэх'; };
  $('#to-log').onclick = () => { $('#rf').hidden = true; $('#to-log').hidden = true; $('#lf').hidden = false; $('#to-reg').hidden = false; $('#auth-title').textContent = 'Нэвтрэх'; };
  $('#rf').onsubmit = guard(async (e) => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    await api('POST', '/auth/register', { name: f.name, phone: f.phone, email: f.email, password: f.password,
      skills: f.skill ? [{ name: f.skill, category: f.category || 'Бусад' }] : [] });
    toast('Бүртгэгдлээ. Одоо нэвтэрнэ үү.'); await enter(f.email, f.password);
  });
}

// ---------- Үндсэн бүтэц ----------
async function boot() {
  try { me = await api('GET', '/me'); } catch { token = null; sessionStorage.removeItem('tok'); return loginView(); }
  $('#root').innerHTML = `<div class="app"><aside><div class="brand">SkillSwap</div>
  <div class="meta who">${esc(me.name)}</div><div class="credit"><b id="bal">–</b><small id="frz"></small></div>
  <nav id="nav"></nav><div style="flex:1"></div><button class="btn" id="out">Гарах</button></aside><main id="main"></main></div>`;
  const tabs = [['search', 'Хайлт'], ['sessions', 'Миний session'], ['credits', 'Credit'], ['notes', 'Мэдэгдэл'], ...(me.role === 'admin' ? [['admin', 'Admin']] : [])];
  if (me.role === 'admin') tab = 'admin';
  $('#nav').innerHTML = tabs.map(([k, l]) => `<button data-tab="${k}">${l}</button>`).join('');
  $('#nav').onclick = (e) => { if (e.target.dataset.tab) { tab = e.target.dataset.tab; show(); } };
  $('#out').onclick = () => { token = null; sessionStorage.removeItem('tok'); loginView(); };
  if (me.restricted_until) toast(`No-show-ын улмаас ${me.restricted_until.slice(0, 10)} хүртэл session захиалах боломжгүй`, true);
  show();
}
async function show() {
  document.querySelectorAll('#nav button').forEach((b) => b.toggleAttribute('aria-current', b.dataset.tab === tab));
  try {
    const bal = await api('GET', '/credits/balance');
    $('#bal').textContent = bal.balance; $('#frz').textContent = bal.frozen ? `credit, царцсан ${bal.frozen}` : 'credit';
    await views[tab]();
  } catch (e) { toast(e.message, true); }
}

// ---------- Хайлт (FR-02, 03, 13) ----------
const views = {};
views.search = async () => {
  $('#main').innerHTML = `<h2>Заагч хайх</h2><form id="sf" class="card row">
  <label>Ур чадвар<input name="skill" value="${esc(cache.skill || '')}" placeholder="Хайх ур чадвар"></label>
  <label>Ангилал<select name="category"><option value="">Бүгд</option><option>Хэл</option><option>Программчлал</option><option>Дизайн</option></select></label>
  <label>Хамгийн бага үнэлгээ<input name="min_rating" type="number" min="0" max="5" step="0.1" value="0" style="width:90px"></label>
  <label>Боломжит цаг<input name="available_from" type="datetime-local"></label><button class="btn pri">Хайх</button></form><div id="res"></div>`;
  $('#sf').onsubmit = guard(async (e) => {
    e.preventDefault(); const f = new FormData(e.target); const q = new URLSearchParams();
    for (const [k, v] of f) if (v) q.set(k, k === 'available_from' ? new Date(v).toISOString() : v);
    cache.skill = f.get('skill');
    const { results } = await api('GET', `/skills/search?${q}`);
    $('#res').innerHTML = results.length ? results.map((t) => `<div class="card" data-t="${esc(t.user_id)}"><div class="head"><b>${esc(t.name)}</b>
      <span>★ ${t.avg_rating ?? '–'}</span></div><div class="meta">${esc(t.skill)} · ${esc(t.category)} · ${t.completed_sessions} session · no-show ${Math.round(t.no_show_rate * 100)}%</div>
      <div class="acts"><button class="btn pri" data-propose="${esc(t.user_id)}" data-skill="${esc(t.skill)}">Session санал болгох</button></div></div>`).join('')
      : '<p class="meta">Үр дүн олдсонгүй. Шүүлтүүрээ багасгаж үзнэ үү.</p>';
  });
  $('#res').onclick = (e) => {
    const b = e.target.closest('[data-propose]'); if (!b) return;
    const card = b.closest('.card'); const now = Date.now();
    card.insertAdjacentHTML('beforeend', `<form class="row pf" style="margin-top:10px"><label>Эхлэх<input name="s" type="datetime-local" value="${local(now)}" required></label>
      <label>Дуусах<input name="e" type="datetime-local" value="${local(now + 3600000)}" required></label>
      <label>Credit<input name="c" type="number" min="1" value="5" style="width:80px"></label><button class="btn pri">Илгээх</button></form>`);
    b.disabled = true;
    $('.pf', card).onsubmit = guard(async (ev) => {
      ev.preventDefault(); const f = new FormData(ev.target);
      await api('POST', '/sessions', { teacher_id: b.dataset.propose, skill: b.dataset.skill, start_time: new Date(f.get('s')).toISOString(),
        end_time: new Date(f.get('e')).toISOString(), credits: +f.get('c') });
      toast('Санал илгээгдлээ'); tab = 'sessions'; show();
    });
  };
};

// ---------- Session (FR-04..10, 12) ----------
views.sessions = async () => {
  const { sessions } = await api('GET', '/sessions');
  $('#main').innerHTML = `<h2>Миний session</h2>` + (sessions.length ? sessions.map((s) => {
    const role = s.teacher_id === me.user_id ? 'teacher' : 'learner';
    const other = role === 'teacher' ? s.learner_name : s.teacher_name, otherId = role === 'teacher' ? s.learner_id : s.teacher_id;
    const a = [];
    if (s.status === 'proposed' && s.proposed_by !== me.user_id) a.push(['accept', 'Зөвшөөрөх', 'pri'], ['counter', 'Өөрчилж санал болгох'], ['decline', 'Татгалзах', 'bad']);
    if (s.status === 'proposed' && s.proposed_by === me.user_id) a.push(['wait', 'Хариу хүлээж байна']);
    if (s.status === 'confirmed' && !s.checkins[role]) a.push(['checkin', 'Check-in', 'pri']);
    if (s.status === 'confirmed') a.push(['noshow', 'No-show мэдээлэх', 'bad']);
    if (['proposed', 'confirmed'].includes(s.status)) a.push(['cancel', 'Цуцлах']);
    if (s.status === 'completed' && !s.ratings[me.user_id]) a.push(['rate', 'Үнэлэх', 'pri']);
    if (s.status === 'completed' && !s.flag_id) a.push(['flag', 'Credit-ийг flag хийх', 'bad']);
    a.push(['chat', 'Чат']);
    return `<div class="card" data-id="${esc(s.session_id)}" data-other="${esc(otherId)}" data-role="${role}" data-credits="${s.credits}">
      <div class="head"><b>${esc(s.skill)} · ${esc(other)}</b><span class="tag ${s.status}">${STATUS[s.status] || s.status}</span></div>
      <div class="meta">${fmt(s.start_time)} – ${fmt(s.end_time)} · ${s.credits} credit${s.flag_id ? ' · flag хийгдсэн' : ''}</div>
      <div class="meta">Check-in: заагч ${s.checkins.teacher ? '✓' : '–'}, суралцагч ${s.checkins.learner ? '✓' : '–'}</div>
      <div class="acts">${a.map(([k, l, c]) => `<button class="btn ${c || ''}" data-act="${k}" ${k === 'wait' ? 'disabled' : ''}>${l}</button>`).join('')}</div></div>`;
  }).join('') : '<p class="meta">Session байхгүй. Хайлтаас заагч сонгоод санал илгээнэ үү.</p>');
  $('#main').onclick = guard(async (e) => {
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    const card = btn.closest('.card'), id = card.dataset.id, act = btn.dataset.act, post = (p, b) => api('POST', `/sessions/${id}/${p}`, b);
    if (act === 'accept' || act === 'decline') await post('respond', { action: act });
    else if (act === 'counter') { const c = prompt('Шинэ credit хэмжээ', card.dataset.credits); if (!c) return; await post('respond', { action: 'counter', credits: +c }); }
    else if (act === 'checkin') await post('check-in', { role: card.dataset.role });
    else if (act === 'noshow') await post('no-show', { absent_user_id: card.dataset.other });
    else if (act === 'cancel') await post('cancel', {});
    else if (act === 'rate') { const st = prompt('Үнэлгээ (1-5 од)', '5'); if (!st) return; await post('rate', { stars: +st, comment: prompt('Сэтгэгдэл (заавал биш)') || '' }); }
    else if (act === 'flag') { const r = prompt('Яагаад шударга бус гэж үзэж байна вэ?'); if (!r) return; await post('flag', { reason: r }); }
    else if (act === 'chat') return chat(card, id);
    toast('Хадгалагдлаа'); show();
  });
};
async function chat(card, id) {
  let box = $('.chat', card);
  if (!box) { box = document.createElement('div'); box.className = 'chat'; card.appendChild(box); }
  const { messages } = await api('GET', `/sessions/${id}/messages`);
  box.innerHTML = messages.map((m) => `<p><b>${esc(m.from_name)}:</b> ${esc(m.text)}</p>`).join('') || '<p class="meta">Мессеж алга.</p>';
  box.insertAdjacentHTML('beforeend', `<form class="row"><input name="t" placeholder="Мессеж бичих" style="flex:1" required><button class="btn pri">Илгээх</button></form>`);
  $('form', box).onsubmit = guard(async (e) => { e.preventDefault(); await api('POST', `/sessions/${id}/messages`, { text: new FormData(e.target).get('t') }); chat(card, id); });
}

// ---------- Credit (FR-05) ----------
views.credits = async () => {
  const [b, { entries }] = await Promise.all([api('GET', '/credits/balance'), api('GET', '/credits/ledger')]);
  const T = { transfer: 'Шилжүүлэг', freeze: 'Царцаалт', refund: 'Буцаалт', release: 'Чөлөөлөлт' };
  $('#main').innerHTML = `<h2>Credit</h2><div class="card">Үлдэгдэл: <b>${b.balance}</b> · Царцсан: <b>${b.frozen}</b></div>
  <div class="card"><table><tr><th>Огноо</th><th>Төрөл</th><th>Credit</th><th>Чиглэл</th></tr>${entries.map((l) => `<tr><td>${fmt(l.at)}</td><td>${T[l.type]}</td><td>${l.credits}</td>
  <td>${l.to === me.user_id ? 'Орсон' : 'Гарсан'}</td></tr>`).join('') || '<tr><td colspan="4" class="meta">Гүйлгээ алга.</td></tr>'}</table></div>`;
};

// ---------- Мэдэгдэл, Calendar (FR-11, 15: симуляци) ----------
views.notes = async () => {
  const { notifications, calendar_events } = await api('GET', '/notifications');
  $('#main').innerHTML = `<h2>Мэдэгдэл</h2><p class="meta">Push болон Google Calendar холболтыг симуляци хэлбэрээр харуулж байна.</p>
  <div class="card">${notifications.map((n) => `<p><span class="tag">${n.state === 'sent' ? 'илгээсэн' : 'товлогдсон'}</span> ${fmt(n.send_at)} · ${esc(n.message)}</p>`).join('') || '<span class="meta">Мэдэгдэл алга.</span>'}</div>
  <h2>Calendar event</h2><div class="card">${calendar_events.map((e) => `<p>${esc(e.title)} · ${fmt(e.start_time)}</p>`).join('') || '<span class="meta">Event алга.</span>'}</div>`;
};

// ---------- Admin (FR-12, 14) ----------
views.admin = async () => {
  const [d, { entries }] = await Promise.all([api('GET', '/admin/dashboard'), api('GET', '/admin/audit-log')]);
  $('#main').innerHTML = `<h2>Маргаан шийдвэрлэх</h2>` + (d.flags.map((f) => `<div class="card" data-f="${esc(f.id)}"><b>${f.credits} credit царцсан</b>
    <div class="meta">Session ${esc(f.session_id)} · ${esc(f.raised_by_name)}: ${esc(f.reason)}</div><div class="acts">
    <button class="btn pri" data-d="approve">Зөвшөөрөх (суралцагчид буцаах)</button><button class="btn" data-d="reject">Татгалзах (заагчид олгох)</button></div></div>`).join('') || '<p class="meta">Нээлттэй flag алга.</p>')
  + `<h2>No-show</h2><div class="card">${d.no_shows.map((n) => `<p>${esc(n.skill)} · ${esc(n.teacher)} / ${esc(n.learner)}</p>`).join('') || '<span class="meta">Алга.</span>'}</div>
  <h2>Audit log</h2><div class="card"><table>${entries.map((l) => `<tr><td>${fmt(l.at)}</td><td>${esc(l.action)}</td><td>${esc(l.target)}</td></tr>`).join('') || '<tr><td class="meta">Бичлэг алга.</td></tr>'}</table></div>`;
  $('#main').onclick = guard(async (e) => {
    const b = e.target.closest('[data-d]'); if (!b) return;
    await api('POST', `/admin/flags/${b.closest('.card').dataset.f}/resolve`, { decision: b.dataset.d, note: '' }); toast('Шийдвэр бүртгэгдлээ'); show();
  });
};

token ? boot() : loginView();
</script>
</body>
</html>
